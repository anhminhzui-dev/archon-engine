<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHON-ENGINE — Agentic Transactional 3D Scene Graph</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090b10;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    #viewport-container {
      flex: 1;
      height: 100%;
      position: relative;
    }
    #side-panel {
      width: 440px;
      height: 100%;
      background: #11141c;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d1017;
    }
    .panel-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #06b6d4;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-header p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #cbd5e1;
      margin-bottom: 8px;
      margin-top: 14px;
    }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .btn-rpc {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 8px 10px;
      font-size: 0.74rem;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .btn-rpc:hover {
      background: #0891b2;
      color: #fff;
      border-color: #06b6d4;
    }
    .btn-rollback {
      background: #471d2b;
      border-color: #9f1239;
      color: #f43f5e;
    }
    .btn-rollback:hover {
      background: #be123c;
      color: #fff;
    }
    #history-log {
      background: #090c12;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.72rem;
      max-height: 180px;
      overflow-y: auto;
      color: #a5f3fc;
    }
    .history-entry {
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    #json-inspector {
      background: #090c12;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.7rem;
      color: #cbd5e1;
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
    }
    #viewport-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 18, 25, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: monospace;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    #viewport-overlay span {
      color: #38bdf8;
      font-weight: 700;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="viewport-container">
    <div id="viewport-overlay">
      REVISION: <span id="rev-badge">r0</span> | STATUS: <span id="status-badge">COMMITTED</span> | NODES: <span id="node-count-badge">1</span>
    </div>
  </div>

  <div id="side-panel">
    <div class="panel-header">
      <h1>ARCHON-ENGINE</h1>
      <p>Headless, deterministic 3D scene-graph mutation engine for autonomous agents. State modifications evaluate transactionally with atomic rollback.</p>
    </div>

    <div class="panel-body">
      <div class="section-title">Agent Transaction RPCs</div>
      <div class="action-grid">
        <button id="rpc-spawn-core" class="btn-rpc">+ Spawn Energy Core</button>
        <button id="rpc-mutate-color" class="btn-rpc">Set Cyan Plasma Material</button>
        <button id="rpc-scale-core" class="btn-rpc">Scale Core 1.5x</button>
        <button id="rpc-spawn-satellite" class="btn-rpc">+ Add Orbital Satellite</button>
        <button id="rpc-rollback" class="btn-rpc btn-rollback">Rollback (Undo)</button>
        <button id="rpc-reset" class="btn-rpc">Reset Scene</button>
      </div>

      <div class="section-title">Atomic Transaction Log</div>
      <div id="history-log"></div>

      <div class="section-title">Live Scene-Graph Schema</div>
      <pre id="json-inspector"></pre>
    </div>
  </div>

  <script type="module">
    import { ArchonEngine } from './archon-core.js';

    // 1. Setup Three.js Viewport
    const container = document.getElementById('viewport-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08090d);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 2, 7);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Lighting
    const ambLight = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 2. Initialize Headless Archon Engine
    let engine = new ArchonEngine();

    // Map of Three.js objects mapped to Archon node IDs
    const threeObjectMap = new Map();

    function syncSceneGraphToThree() {
      const graph = engine.sceneGraph;

      // Update badges
      document.getElementById('rev-badge').textContent = `r${engine.revision - 1}`;
      document.getElementById('node-count-badge').textContent = Object.keys(graph.nodes).length;
      document.getElementById('json-inspector').textContent = JSON.stringify(graph, null, 2);

      // Render history log
      const histEl = document.getElementById('history-log');
      histEl.innerHTML = '';
      [...engine.history].reverse().forEach(h => {
        const div = document.createElement('div');
        div.className = 'history-entry';
        div.innerHTML = `<strong>r${h.revision}</strong> [${h.checksum}]<br>${h.description}`;
        histEl.appendChild(div);
      });

      // Clear existing meshes
      for (const [id, obj] of threeObjectMap) {
        scene.remove(obj);
      }
      threeObjectMap.clear();

      // Rebuild meshes from state
      for (const [id, node] of Object.entries(graph.nodes)) {
        if (id === 'root') continue;

        let mat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.4, metalness: 0.2 });
        if (node.materialId && graph.materials[node.materialId]) {
          const mData = graph.materials[node.materialId];
          mat.color.set(mData.color);
          mat.roughness = mData.roughness;
          mat.metalness = mData.metalness;
        }

        let geom;
        if (id === 'energy_core') {
          geom = new THREE.TorusKnotGeometry(0.8, 0.25, 100, 16);
        } else if (id.startsWith('satellite')) {
          geom = new THREE.IcosahedronGeometry(0.35, 2);
        } else {
          geom = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        }

        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(...node.transform.position);
        mesh.rotation.set(...node.transform.rotation);
        mesh.scale.set(...node.transform.scale);

        scene.add(mesh);
        threeObjectMap.set(id, mesh);
      }
    }

    syncSceneGraphToThree();

    // RPC Actions
    document.getElementById('rpc-spawn-core').addEventListener('click', () => {
      engine.dispatchTransaction([
        {
          op: "SET_MATERIAL",
          id: "mat_plasma_core",
          color: "#f59e0b",
          roughness: 0.2,
          metalness: 0.8
        },
        {
          op: "CREATE_NODE",
          id: "energy_core",
          type: "TorusKnot",
          materialId: "mat_plasma_core",
          transform: { position: [0, 0, 0], scale: [1, 1, 1] }
        }
      ], "Agent: Spawn central energy core");
      syncSceneGraphToThree();
    });

    document.getElementById('rpc-mutate-color').addEventListener('click', () => {
      engine.dispatchTransaction([
        {
          op: "SET_MATERIAL",
          id: "mat_plasma_core",
          color: "#06b6d4",
          roughness: 0.1,
          metalness: 0.95
        }
      ], "Agent: Switch plasma state to high-energy cyan");
      syncSceneGraphToThree();
    });

    document.getElementById('rpc-scale-core').addEventListener('click', () => {
      const core = engine.sceneGraph.nodes["energy_core"];
      if (!core) return alert("Spawn core first!");
      const curr = core.transform.scale[0];
      const next = curr > 1.4 ? 1.0 : 1.5;
      engine.dispatchTransaction([
        {
          op: "MUTATE_TRANSFORM",
          id: "energy_core",
          scale: [next, next, next]
        }
      ], `Agent: Scale core to ${next}x`);
      syncSceneGraphToThree();
    });

    let satCount = 0;
    document.getElementById('rpc-spawn-satellite').addEventListener('click', () => {
      satCount++;
      const id = `satellite_${satCount}`;
      const angle = (satCount / 3) * Math.PI * 2;
      const x = Math.cos(angle) * 2.2;
      const z = Math.sin(angle) * 2.2;
      engine.dispatchTransaction([
        {
          op: "CREATE_NODE",
          id: id,
          type: "OrbitalSatellite",
          transform: { position: [x, 0, z], scale: [1, 1, 1] }
        }
      ], `Agent: Deploy orbital satellite #${satCount}`);
      syncSceneGraphToThree();
    });

    document.getElementById('rpc-rollback').addEventListener('click', () => {
      if (engine.revision <= 1) return;
      engine.rollback(engine.revision - 2);
      syncSceneGraphToThree();
    });

    document.getElementById('rpc-reset').addEventListener('click', () => {
      engine = new ArchonEngine();
      syncSceneGraphToThree();
    });

    // Render loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Rotate nodes if present
      const core = threeObjectMap.get('energy_core');
      if (core) {
        core.rotation.y = t * 0.5;
        core.rotation.x = t * 0.3;
      }

      for (const [id, mesh] of threeObjectMap) {
        if (id.startsWith('satellite')) {
          mesh.rotation.y = t;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
